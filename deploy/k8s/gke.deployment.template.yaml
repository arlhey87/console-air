# GKE StatefulSet + Service template. Rendered by deploy/publish-gar.sh via envsubst
# (${IMAGE_NAME}, ${REPLICAS}); environment values live in deploy/deploy.env (gitignored).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: akash-console-air
  labels:
    name: akash-console-air
    # component: web
spec:
  replicas: $REPLICAS
  # revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: akash-console-air
  template:
    metadata:
      labels:
        app: akash-console-air
        # component: web
    spec:
      terminationGracePeriodSeconds: 31
      containers:
        - name: akash-console-air
          image: ${IMAGE_NAME}
          imagePullPolicy: "Always"
          ports:
            - name: app-http
              containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: MAINTENANCE_MODE
              value: "false"
          readinessProbe:
            httpGet:
              path: /akash-console
              port: app-http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: app-http
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: akash-console-air-service
  labels:
    app: akash-console-air-service
spec:
  ports:
    - port: 8080
      name: http
      targetPort: app-http
  selector:
    app: akash-console-air
  # clusterIP: None