# ============================================================================
# akash-console.conf — drop-in para la plataforma <platform-domain>
# Ruta sugerida: <nginx-includes-dir>/akash-console.conf
# (se incluye DENTRO del server { server_name <host>; })
# ----------------------------------------------------------------------------
# Requisito: la imagen se compiló con basePath=/akash-console
#            (ver docs/deploy/Dockerfile.subpath). Sin basePath, el backend NO
#            responde en /akash-console y todo da 404.
#
# Por qué hay varios `location`:
#   La app sirve sus PÁGINAS, sus assets /_next y sus rutas API bajo
#   /akash-console (gracias a basePath). PERO su JavaScript de cliente llama a
#   varias rutas ABSOLUTAS DESDE LA RAÍZ que basePath NO reescribe:
#       /api/proxy/*           (Console API, chain REST/RPC, templates)
#       /api/provider-proxy/*  (estado/logs/shell del proveedor)
#       /api/node-status       /api/blockchain-config
#       /sdl-schema.yaml       (esquema del editor SDL)
#   En un host de plataforma COMPARTIDO no se puede capturar todo /api en la
#   raíz, así que se "puentean" SOLO esos subpaths específicos hacia
#   /akash-console/...  (ver nota de colisiones al final).
#   Las /images/* usan next/image → ya quedan bajo /akash-console (no requieren puente).
# ============================================================================

# ---- 1) App + páginas + /_next + rutas API (todo bajo /akash-console) ----
# Modificador ^~ (PREFIJO): da precedencia sobre los `location` regex de la
# plataforma. proxy_pass SIN URI → nginx preserva la ruta original completa
# (incl. el prefijo /akash-console). NO usar `$1`: solo existe con regex (~).
location ^~ /akash-console {
    proxy_pass http://akash-console-air-service:8080;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;          # TLS lo termina nginx
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header Origin            '';               # ver nota (3)
    proxy_read_timeout 10m;
}

# ---- 2) BRIDGES: llamadas root-absolute del cliente (no conscientes de basePath) ----
# Capa BFF: Console API (/v1/*), chain REST/RPC y templates van todos por /api/proxy/
location ^~ /api/proxy/ {
    proxy_pass http://akash-console-air-service:8080/akash-console/api/proxy/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header Origin            '';
    proxy_read_timeout 10m;
}

# Provider proxy (HTTP; el WebSocket del proveedor va DIRECTO al upstream, no por aquí)
location ^~ /api/provider-proxy/ {
    proxy_pass http://akash-console-air-service:8080/akash-console/api/provider-proxy/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header Origin            '';
    proxy_read_timeout 10m;
}

# Health/estado del nodo y configuración de cadena (rutas exactas)
location = /api/node-status {
    proxy_pass http://akash-console-air-service:8080/akash-console/api/node-status$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /api/blockchain-config {
    proxy_pass http://akash-console-air-service:8080/akash-console/api/blockchain-config$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Esquema YAML que el editor Monaco carga para validar el SDL
location = /sdl-schema.yaml {
    proxy_pass http://akash-console-air-service:8080/akash-console/sdl-schema.yaml;
    proxy_set_header Host $host;
}

# ============================================================================
# NOTAS
# (1) COLISIONES: si el server compartido ya tiene un handler de /api, revisa
#     su tipo. Si es un REGEX catch-all (p. ej. `~ ^/api/(.+)`), por precedencia
#     de nginx `=` (exacto) y `^~` (prefijo) SIEMPRE le ganan, así que los
#     bridges interceptan primero. Haz grep de `location` en los includes del
#     server para confirmar que ningún otro prefijo choca con estas rutas.
#     Como este archivo se incluye solo dentro de un `server {}`, no afecta a
#     otros hosts.
#     Único punto a confirmar (riesgo bajo): que el backend del catch-all NO
#     sirva endpoints reales llamados /api/proxy, /api/provider-proxy,
#     /api/node-status o /api/blockchain-config. Si los usara -> subdominio
#     dedicado (ver docs/despliegue-gcp-docker-nginx.md §8).
# (2) $connection_upgrade debe estar definido a nivel http {} (normalmente ya
#     existe en la plataforma):
#         map $http_upgrade $connection_upgrade { default upgrade; "" close; }
# (3) proxy_set_header Origin '': lo trae tu config actual. Mantenlo solo si
#     resolvía un check de origen concreto; el WS del proveedor NO pasa por
#     este nginx, así que para Console Air no es necesario por sí mismo.
# ============================================================================
